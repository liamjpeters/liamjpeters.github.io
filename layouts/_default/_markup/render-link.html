{{- $link := .Destination -}}
{{- $isExternal := and (hasPrefix $link "http") (not (hasPrefix $link site.BaseURL)) -}}
{{- if $isExternal -}}
<a href="{{ $link | safeURL }}"
   {{- with .Title }} title="{{ . }}"{{ end }}
   target="_blank"
   rel="noopener noreferrer">
   {{- .Text | safeHTML -}}
</a>
{{- else -}}
<a href="{{ $link | safeURL }}"
   {{- with .Title }} title="{{ . }}"{{ end }}>
   {{- .Text | safeHTML -}}
</a>
{{- end -}}
