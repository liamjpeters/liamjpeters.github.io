<div class="grid gap-6 my-8 md:grid-cols-2">
  {{ range .Site.Data.certificates }}
  <div class="flex flex-col items-center p-6 transition-shadow bg-white border border-gray-200 rounded-lg shadow-sm hover:shadow-md dark:bg-gray-800 dark:border-gray-700">
    <div class="relative w-32 h-32 mb-4">
      <img src="{{ .image }}" alt="{{ .name }} Badge" class="object-contain w-full h-full" loading="lazy">
    </div>
    <h3 class="mb-1 text-xl font-bold text-center text-gray-900 dark:text-white">
      {{ .name }}
    </h3>
    <p class="mb-3 text-sm font-medium text-gray-500 dark:text-gray-400">
      Earned: {{ .date }}
    </p>
    <p class="flex-grow mb-6 text-sm text-center text-gray-600 dark:text-gray-300">
      {{ .description }}
    </p>
    <a href="{{ .url }}" target="_blank" rel="noopener noreferrer" 
       class="inline-flex items-center px-4 py-2 text-sm font-medium text-gray-900 bg-white border border-gray-200 rounded-lg hover:bg-gray-100 focus:z-10 focus:ring-4 focus:outline-none focus:ring-gray-200 dark:bg-gray-800 dark:text-gray-400 dark:border-gray-600 dark:hover:text-white dark:hover:bg-gray-700 dark:focus:ring-gray-700">
      View Credential
      {{ partial "icon.html" (dict "name" "external-link" "class" "w-3 h-3 ms-2 rtl:rotate-180") }}
    </a>
  </div>
  {{ end }}
</div>
